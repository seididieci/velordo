[package]
name = "gpu"
version = "0.1.0"
edition = "2024"

# Crate fuori dal workspace del kernel: build freestanding separata.
[workspace]

[dependencies]
civis = { path = "../../libs/civis" }
vela = { path = "../../libs/vela" }
# Protocollo display (descrittore + PRESENT): D3, il driver non sa disegnare.
term = { path = "../../libs/term" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
