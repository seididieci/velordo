[package]
name = "dns"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
civis = { path = "../../libs/civis" }
net = { path = "../../libs/net" }
# DoT (N6.3, ADR-0072): adattatore TLS puro + trasporto TCP sull'endpoint
# `net` (condiviso con il probe tlsprobe).
tls = { path = "../../libs/tls" }
tls-net = { path = "../../libs/tls-net" }
net-ep = { path = "../../libs/net-ep" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
