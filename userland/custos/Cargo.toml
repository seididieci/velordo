[package]
name = "custos"
version = "0.1.0"
edition = "2024"

# Crate fuori dal workspace del kernel: build freestanding separata.
[workspace]

[dependencies]
civis = { path = "../../libs/civis" }
custos-proto = { path = "../../libs/custos-proto" }
identis-proto = { path = "../../libs/identis-proto" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
