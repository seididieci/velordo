[package]
name = "tlsprobe"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
civis = { path = "../../libs/civis" }
# Adattatore TLS puro + collante col sistema reale (endpoint TCP di `net`,
# orologio da `usertime`). Vedi ADR-0072.
tls = { path = "../../libs/tls" }
tls-net = { path = "../../libs/tls-net" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"