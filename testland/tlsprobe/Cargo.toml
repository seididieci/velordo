[package]
name = "tlsprobe"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
civis = { path = "../../libs/civis" }
# `civis-clock`: orologio reale (servizio Time) per la validita' dei
# certificati. Il crate resta puro: l'aggancio e' una feature (ADR-0072).
tls = { path = "../../libs/tls", features = ["civis-clock"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
