[package]
name = "civis"
version = "0.1.0"
edition = "2024"

# Crate fuori dal workspace del kernel: build freestanding separata.


[dependencies]
syscall-numbers = { path = "../../syscall-numbers" }
arcafs = { path = "../../arcafs" }
vfscli = { path = "../vfscli" }
blake2s = { path = "../../blake2s" }
net-ep = { path = "../net-ep" }
broker-proto = { path = "../broker-proto" }
sess-proto = { path = "../sess-proto" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
