[package]
name = "tls"
version = "0.1.0"
edition = "2024"

# Crate fuori dal workspace del kernel: build freestanding separata.
[workspace]

[dependencies]
# ADR-0072: la strada no_std e' il modulo `pki` (feature `rustpki`);
# `webpki` e' std-only. `rsa` implica `rustpki` + `alloc` ed e' necessario
# per le catene firmate RSA (ISRG Root X1 e' RSA-4096). `p384` abilita le
# arm ECDSA-SHA384 di `pki` (verifica della firma della catena e del
# `CertificateVerify`): senza, un leaf firmato `ecdsa-with-SHA384` (es. la
# catena DigiCert G3 di Quad9) fallisce con `InvalidSignatureScheme`.
embedded-tls = { version = "=0.19.0", default-features = false, features = [
    "rustpki",
    "rsa",
    "p384",
    "alloc",
] }
embedded-io = "0.7"
# DRBG: ChaCha20 con seed da RDRAND (rand_core 0.6, lo stesso di embedded-tls).
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
# `CryptoProvider::Signature` deve nominare il tipo (embedded-tls usa
# `p256::ecdsa::DerSignature`); non facciamo firma client (mTLS assente).
p256 = { version = "0.13", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
